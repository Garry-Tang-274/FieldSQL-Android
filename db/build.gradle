plugins { id 'com.android.library' }
android {
    namespace 'dev.fieldsql.db'
    compileSdk 35
    defaultConfig { minSdk 24; consumerProguardFiles 'consumer-rules.pro' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'org.postgresql:postgresql:42.7.15'
    implementation 'org.mariadb.jdbc:mariadb-java-client:2.7.15'
    implementation 'com.github.mwiede:jsch:2.28.8'
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.87' // Ed25519 and X25519 on Android's Java-8 runtime
}

